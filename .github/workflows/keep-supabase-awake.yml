# Keeps the Supabase database awake.
# Supabase's free plan pauses a project after about a week with no activity. This asks the database
# a tiny question once a day (free, runs on GitHub's computers), so it never counts as inactive.
# The key below is the public "publishable" key the website already uses, so it's safe to have here.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch: {} # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database a tiny question
        run: |
          curl --fail --silent --show-error \
            "https://jbkbxudmonnebeidhyos.supabase.co/rest/v1/players?select=id&limit=1" \
            -H "apikey: sb_publishable_HAS8NtN-jrEMJs2N4xgIwg_x02VSRRa" \
            -o /dev/null -w "Supabase answered with HTTP %{http_code}\n"
